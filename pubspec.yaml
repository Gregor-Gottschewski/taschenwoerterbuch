name: taschenwoerterbuch
description: "Umfassendes Wörterbuch für die Sprachen Deutsch und Französisch und Konjugationstabellen."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: any
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.4+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  remove_unused_localizations: ^1.1.2
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true
  assets:
    # Nur für Tests ohne Server: gebündelte Wörterbücher.
    - assets/dev/
  fonts:
     - family: Gochi Hand
       fonts:
         - asset: assets/fonts/gochi-hand/GochiHand-Regular.ttf