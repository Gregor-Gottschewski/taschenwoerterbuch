name: Bug
description: Something does not work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please fill in the fields as precisely as possible.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the problem?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the search
        2. Enter the term "…"
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Search
        - Detail view
        - Conjugation
        - Data / database
        - Audio
        - Other
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version
      placeholder: 1.0.0+1
  - type: textarea
    id: logs
    attributes:
      label: Screenshots / logs
      description: Images or log output can be pasted directly here.
