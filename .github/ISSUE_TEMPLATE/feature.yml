name: Feature
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Problem / motivation
      description: Which problem should be solved?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Desired solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Which other approaches were considered?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Search
        - Detail view
        - Conjugation
        - Data / database
        - Audio
        - Other
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know the feature is done?
      value: |
        - [ ]
        - [ ]
